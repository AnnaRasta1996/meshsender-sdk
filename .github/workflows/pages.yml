# GitHub Pages — manual workflow_dispatch only.
# Deploy is GATED until explicit owner approval via workflow input.
# Artifact: allowlisted playground/ only (includes generated meshsender-sdk.bundle.js).
name: pages-manual-gated

on:
  workflow_dispatch:
    inputs:
      owner_approve_deploy:
        description: >-
          Explicit owner approval to deploy GitHub Pages after independent review.
          Leave false to prepare artifact only (default). Set true ONLY when publication is approved.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build:browser
      - name: Upload playground artifact only
        uses: actions/upload-pages-artifact@v3
        with:
          path: playground

  deploy:
    needs: prepare
    # Official deploy-pages job — runs ONLY when owner explicitly approves.
    if: ${{ inputs.owner_approve_deploy == true }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
